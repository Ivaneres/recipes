[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -v
asyncio_mode = auto
markers =
    integration: marks tests that call external recipe URLs (need network, run with: pytest -m integration)
filterwarnings =
    ignore::DeprecationWarning
    ignore::pydantic.PydanticDeprecatedSince20
