# Temporary HTTP-only configuration for initial certbot setup
# After getting certificates, replace with the full HTTPS config

# Backend API - HTTP only (will be upgraded to HTTPS by certbot)
server {
    listen 80;
    server_name api.ereshchenko.com;

    # API proxy
    location /api {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Static file uploads
    location /uploads {
        alias /home/recipes-app/recipes-app/backend/uploads;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Health check
    location /health {
        proxy_pass http://127.0.0.1:8001;
        access_log off;
    }
}

# Redirect base domain to recipes subdomain
server {
    listen 80;
    server_name ereshchenko.com www.ereshchenko.com;

    # Redirect to recipes subdomain
    return 301 http://recipes.ereshchenko.com$request_uri;
}

# Frontend - HTTP only (will be upgraded to HTTPS by certbot)
server {
    listen 80;
    server_name recipes.ereshchenko.com;

    root /home/recipes-app/recipes-app/frontend/dist;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json;

    # Redirect root to recipes page
    location = / {
        return 301 /recipes;
    }

    # Serve static files - React Router handles routing
    location / {
        try_files $uri $uri/ @fallback;
    }

    # Fallback to index.html for client-side routing
    location @fallback {
        rewrite ^.*$ /index.html last;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
